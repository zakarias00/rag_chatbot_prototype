[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-chatbot-prototype"
version = "0.1.0"
description = "An agentic RAG chatbot prototype project"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain-core==0.3.37",
    "langgraph==0.2.76",
    "scikit-learn==1.6.1",
    "streamlit==1.42.2",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4"]

[tool.setuptools.packages.find]
where = ["src"]