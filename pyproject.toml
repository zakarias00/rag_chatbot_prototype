[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-chatbot-prototype"
version = "0.1.0"
description = "An agentic RAG chatbot prototype project"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain-core==1.7.5",
    "langgraph==1.2.19",
    "requests==2.34.2",
    "scikit-learn==1.9.1",
    "streamlit==1.42.2",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
namespaces = true